<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IoT Dashboard</title>
  <meta name="author" content="Max Manning">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body class="bg-light">
  <header class="bg-dark text-white text-center py-3 mb-4">
    <h1 class="my-0">Device Dashboard</h1>
  </header>

  <div class="container">
    <div class="row g-4">

      <!-- Connection Status -->
      <div class="col-md-4">
        <div class="card p-3">
          <h2 class="h5">Connection Status</h2>
          <p>Status:
            <span id="connectionStatus" class="badge bg-danger">
              Disconnected
            </span>
          </p>
        </div>
      </div>

      <!-- LED Patterns -->
      <div class="col-md-8">
        <div class="card p-3">
          <h2 class="h5">LED Patterns</h2>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-primary" onclick="setLEDMode('blink')">Blink</button>
            <div class="btn-group">
              <button type="button" class="btn btn-success" onclick="setLEDMode('linear')">Chase</button>
              <button type="button" class="btn btn-success dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown" aria-expanded="false" >
                <span class="visually-hidden">Toggle Dropdown</span>
              </button>
              <ul class="dropdown-menu">
                
                <li><h6 class="dropdown-header">Easing Function</h6></li>
                <li><hr class="dropdown-divider"></li>
                <li><button class="dropdown-item" onclick="setLEDMode('linear')">Linear</button></li>
                <li><button class="dropdown-item" onclick="setLEDMode('ease in')">Ease in</button></li>
                <li><button class="dropdown-item" onclick="setLEDMode('ease out')">Ease out</button></li>
                <li><button class="dropdown-item" onclick="setLEDMode('ease in out')">Ease in & out</button></li>
              </ul>
            </div>
            <button class="btn btn-warning" onclick="setLEDMode('rainbow')">Rainbow</button>
            <button class="btn btn-danger" onclick="setLEDMode('flame')">Flame</button>
            <button class="btn btn-dark" onclick="setLEDMode('binary')">Binary</button>
            <button class="btn btn-secondary" onclick="setLEDMode('temp')">Temperature</button>
            <button class="btn btn-outline-secondary" onclick="">Auto</button>
          </div>
        </div>
      </div>

      <!-- Temperature Graph -->
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <h2 class="h5">Temperature Data</h2>
          <p id="currentTemp">No Temperature Data</p>
          <div id="loadingSpinner" class="text-center m-auto">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <div id="mainContent" style="display: none;">
            <canvas id="temperatureChart" class="h-100 w-100 bg-white"></canvas>
          </div>
        </div>
      </div>

      <!-- Second Graph -->
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <h2 class="h5">Second Graph (e.g. Humidity)</h2>
          <canvas id="secondChart"></canvas>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/temperature-graph.js') }}"></script>
  <script src="{{ url_for('static', filename='js/led-modes.js') }}"></script>
</body>

</html>
