<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IoT Dashboard</title>
  <meta name="author" content="Max Manning">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>

<body>
  <header class="bg-dark text-white text-center py-3 mb-4">
    <h1>Device Dashboard</h1>
  </header>

  <div class="container">
    <div class="row g-4">

      <!-- Connection Status -->
      <div class="col-md-4">
        <div class="card p-3">
          <h2 class="h5">Connection Status</h2>
          <p>Status:
            <span id="connectionStatus" class="badge bg-danger">
              Disconnected
            </span>
          </p>
        </div>
      </div>

      <!-- LED Patterns -->
      <div class="col-md-8">
        <div class="card p-3">
          <h2 class="h5">LED Patterns</h2>
          <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-primary">Blink</button>
            <button class="btn btn-secondary">Chase</button>
            <div class="dropdown">
              <button class="btn btn-success dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                Ease
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Ease in</a></li>
                <li><a class="dropdown-item" href="#">Ease out</a></li>
                <li><a class="dropdown-item" href="#">Ease in out</a></li>
              </ul>
            </div>
            <button class="btn btn-warning">Rainbow</button>
            <button class="btn btn-danger">Flame</button>
            <button class="btn btn-dark">Binary</button>
            <button class="btn btn-info">Auto</button>
          </div>
        </div>
      </div>

      <!-- Temperature Graph -->
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <h2 class="h5">Temperature Data</h2>

          <div id="loadingSpinner" class="text-center m-auto">
            <div class="spinner-border" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <div id="mainContent" style="display: none;">
            <canvas id="temperatureChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Second Graph -->
      <div class="col-md-6">
        <div class="card p-3 h-100">
          <h2 class="h5">Second Graph (e.g. Humidity)</h2>
          <canvas id="secondChart"></canvas>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/temperature-graph.js') }}"></script>
</body>

</html>
